<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Monitor -->
  <rect x="96" y="120" width="320" height="220" rx="16" fill="#0f3460" stroke="#007aff" stroke-width="8"/>
  <rect x="116" y="140" width="280" height="160" rx="4" fill="#1a1a2e"/>
  <!-- Terminal text lines -->
  <line x1="140" y1="170" x2="300" y2="170" stroke="#34c759" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="200" x2="260" y2="200" stroke="#34c759" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="230" x2="280" y2="230" stroke="#34c759" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="260" x2="240" y2="260" stroke="#34c759" stroke-width="6" stroke-linecap="round"/>
  <!-- Stand -->
  <rect x="240" y="340" width="32" height="40" rx="4" fill="#007aff"/>
  <rect x="180" y="380" width="152" height="16" rx="8" fill="#007aff"/>
  <!-- Keyboard -->
  <rect x="120" y="400" width="272" height="80" rx="12" fill="#0f3460" stroke="#007aff" stroke-width="4"/>
  <rect x="136" y="416" width="240" height="48" rx="6" fill="#1a1a2e"/>
  <!-- Key rows -->
  <line x1="156" y1="432" x2="356" y2="432" stroke="#007aff" stroke-width="3" stroke-linecap="round"/>
  <line x1="156" y1="448" x2="356" y2="448" stroke="#007aff" stroke-width="3" stroke-linecap="round"/>
  <line x1="156" y1="464" x2="356" y2="464" stroke="#007aff" stroke-width="3" stroke-linecap="round"/>
  <!-- KVM text -->
  <text x="256" y="100" font-family="monospace" font-size="48" font-weight="bold" fill="#007aff" text-anchor="middle">KVM</text>
</svg>